<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AWS Task Manager</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 40px;
            color: #1d1d1f;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            font-weight: 600;
            font-size: 32px;
            margin-bottom: 30px;
        }

        h2 {
            font-weight: 500;
            margin-top: 40px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0,113,227,0.2);
        }

        button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        button:hover {
            background-color: #005bb5;
        }

        .task {
            padding: 16px;
            border-bottom: 1px solid #eee;
        }

        .task:last-child {
            border-bottom: none;
        }

        a {
            color: #0071e3;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .delete-btn {
            background-color: #ff3b30;
            margin-top: 10px;
        }

        .delete-btn:hover {
            background-color: #d70015;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AWS Task Manager</h1>

    <!-- FORM -->
    <div class="card">
        <form action="/add" method="POST" enctype="multipart/form-data">

            <label>Title</label>
            <input type="text" name="title" required>

            <label>Description</label>
            <textarea name="description"></textarea>

            <label>File</label>
            <input type="file" name="file">

            <button type="submit">Add Task</button>
        </form>
    </div>

    <!-- TASK LIST -->
    <h2>Tasks</h2>

    {% for task in tasks %}
    <div class="card task">

        <strong>{{ task.title }}</strong>
        <p>{{ task.description }}</p>

        {% if task.file_url %}
        📎 <a href="{{ task.file_url }}" target="_blank">Download File</a>
        {% endif %}

        <form action="/delete/{{ task.id }}" method="POST">
            <button class="delete-btn" type="submit">Delete</button>
        </form>

    </div>
    {% endfor %}

</div>

</body>
</html>
